version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cohonon
      POSTGRES_PASSWORD: cohonon
      POSTGRES_DB: cohonon
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      DATABASE_PUBLIC_URL: postgresql://cohonon:cohonon@db:5432/cohonon
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      - db
      - redis

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - '3000:8080'
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
    env_file:
      - .env
    depends_on:
      - api

volumes:
  pgdata:
