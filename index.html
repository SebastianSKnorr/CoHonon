<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoHonon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #070c12;
      --accent:  #5ab4d4;
      --frost:   #a8d8ee;
      --text:    #ddeef8;
      --muted:   #5a8099;
      --border:  #162330;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
    }

    /* aurora glow */
    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      width: 120vw;
      height: 60vh;
      background: radial-gradient(ellipse at center, rgba(60,140,190,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .scene {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      overflow: hidden;
    }

    .ghost {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(5rem, 20vw, 20rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(90, 180, 212, 0.11);
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 440px;
      width: 100%;
    }

    .logo {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    h1 span { color: var(--accent); }

    p.sub {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 340px;
      font-weight: 300;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.35;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
    }

    input {
      background: rgba(90,180,212,0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 300;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      width: 100%;
    }

    input::placeholder { color: var(--muted); }
    input:focus {
      border-color: rgba(90,180,212,0.35);
      background: rgba(90,180,212,0.06);
    }

    button {
      background: transparent;
      border: 1px solid rgba(90,180,212,0.5);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: var(--frost);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      width: 100%;
    }

    button:hover {
      background: rgba(90,180,212,0.08);
      border-color: rgba(90,180,212,0.8);
    }

    button:disabled { opacity: 0.4; cursor: default; }

    .message { font-size: 0.85rem; min-height: 1.2em; font-weight: 300; }
    .message.success { color: #7ecaa8; }
    .message.error   { color: #c87e8a; }
  </style>
</head>
<body>
  <div class="scene">
    <div class="ghost">Coming Soon</div>
    <div class="content">
      <div class="logo">CoHonon</div>
      <h1>The north<br/>is coming<span>.</span></h1>
      <div class="divider"></div>
      <p class="sub">A world where brands live, users arrive as characters, and real products change hands. Be first to know when we open.</p>
      <form id="form">
        <input type="text"  id="name"  placeholder="Your name"  autocomplete="name" />
        <input type="email" id="email" placeholder="Your email" required autocomplete="email" />
        <button type="submit" id="btn">Notify me when ready</button>
        <p class="message" id="msg"></p>
      </form>
    </div>
  </div>

  <script>
    const API = 'https://cohonon-platform-production.up.railway.app'
    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault()
      const btn = document.getElementById('btn')
      const msg = document.getElementById('msg')
      const email = document.getElementById('email').value.trim()
      const name  = document.getElementById('name').value.trim()
      btn.disabled = true
      btn.textContent = 'Sending…'
      msg.className = 'message'
      msg.textContent = ''
      try {
        const res = await fetch(`${API}/api/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name, source: 'landing' }),
        })
        if (res.ok) {
          msg.className = 'message success'
          msg.textContent = "You're on the list. We'll be in touch."
          document.getElementById('form').reset()
        } else { throw new Error() }
      } catch {
        msg.className = 'message error'
        msg.textContent = 'Something went wrong. Try again.'
      } finally {
        btn.disabled = false
        btn.textContent = 'Notify me when ready'
      }
    })
  </script>
</body>
</html>
