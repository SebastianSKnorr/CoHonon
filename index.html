<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoHonon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0c0b;
      --accent: #c4601a;
      --text: #e8e0d4;
      --muted: #9c8f83;
      --border: #2a2520;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
    }

    .scene {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      overflow: hidden;
    }

    .ghost {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(5rem, 20vw, 20rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(196, 96, 26, 0.15);
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      max-width: 480px;
      width: 100%;
    }

    .logo {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    h1 span { color: var(--accent); }

    p.sub {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 360px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      margin-top: 0.5rem;
    }

    input {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input::placeholder { color: var(--muted); }
    input:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
      width: 100%;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: default; }

    .message {
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    .message.success { color: #6ab04c; }
    .message.error { color: #e05c4a; }
  </style>
</head>
<body>
  <div class="scene">
    <div class="ghost">Coming Soon</div>

    <div class="content">
      <div class="logo">CoHonon</div>

      <h1>Commerce<br/>reimagined<span>.</span></h1>

      <p class="sub">A world where brands live, users arrive as characters, and real products change hands. Be first to know.</p>

      <form id="form">
        <input type="text" id="name" placeholder="Your name" autocomplete="name" />
        <input type="email" id="email" placeholder="Your email" required autocomplete="email" />
        <button type="submit" id="btn">Notify me</button>
        <p class="message" id="msg"></p>
      </form>
    </div>
  </div>

  <script>
    const API = 'https://cohonon-platform-production.up.railway.app'

    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault()
      const btn = document.getElementById('btn')
      const msg = document.getElementById('msg')
      const email = document.getElementById('email').value.trim()
      const name = document.getElementById('name').value.trim()

      btn.disabled = true
      btn.textContent = 'Sending…'
      msg.className = 'message'
      msg.textContent = ''

      try {
        const res = await fetch(`${API}/api/subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name, source: 'landing' }),
        })

        if (res.ok) {
          msg.className = 'message success'
          msg.textContent = "You're on the list. We'll be in touch."
          document.getElementById('form').reset()
        } else {
          throw new Error()
        }
      } catch {
        msg.className = 'message error'
        msg.textContent = 'Something went wrong. Try again.'
      } finally {
        btn.disabled = false
        btn.textContent = 'Notify me'
      }
    })
  </script>
</body>
</html>
